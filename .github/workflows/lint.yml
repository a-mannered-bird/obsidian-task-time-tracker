name: Node.js build

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm test

    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: "npm"
            - run: npm ci
            # A stale cache only means the service re-downloads a newer
            # "latest" Obsidian; runs stay correct either way.
            - name: Cache Obsidian downloads
              uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}
            # Obsidian needs a display server and a window manager on Linux.
            # Xvfb is preinstalled on the runner image; only the window
            # manager is missing, so a container image would cost more in
            # pull time than this install saves.
            - name: Set up virtual graphics
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -q -y --no-install-recommends herbstluftwm dzen2 x11-xserver-utils
                  export DISPLAY=:99
                  echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
                  Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
                  sleep 1
                  herbstluftwm &
                  sleep 1
            - run: npm run test:e2e
              env:
                  WDIO_MAX_INSTANCES: 2

